{% extends 'crm/base.html' %}{% block content %}
<h3>Login</h3>
<form method="post" class="col-md-4">{% csrf_token %}
  {{ form.non_field_errors }}
  <div class="mb-3"><label class="form-label" for="username">Username</label><input id="username" name="username" class="form-control" required></div>
  <div class="mb-3"><label class="form-label" for="password">Password</label><input id="password" type="password" name="password" class="form-control" required></div>
  <button class="btn btn-primary">Login</button>
</form>{% endblock %}
