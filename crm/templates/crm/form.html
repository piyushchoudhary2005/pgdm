{% extends 'crm/base.html' %}{% block content %}
<h3>{{ title }}</h3>
<form method="post" class="col-md-6">{% csrf_token %}
  <div class="text-danger">{{ form.non_field_errors }}</div>
  {% for f in form %}
  <div class="mb-3"><label class="form-label" for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}
    {% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>
  {% endfor %}
  <button class="btn btn-primary">Save</button> <a class="btn btn-link" href="{{ list_url }}">Cancel</a>
</form>{% endblock %}
